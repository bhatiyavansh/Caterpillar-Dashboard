[project]
name = "cat-copilot"
version = "0.1.0"
description = "CAT Copilot - smart operator assistant for Caterpillar machinery"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13.0",
    "pydantic>=2.9",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "shap>=0.46",
    "joblib>=1.4",
    "faker>=30.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["simulator", "intelligence"]

[tool.pytest.ini_options]
testpaths = ["tests"]
