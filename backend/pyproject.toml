[project]
name = "copilot-backend"
version = "0.1.0"
description = "CAT Copilot orchestrator (Person B): hub, agent, RAG, reports, voice"
requires-python = ">=3.11"
dependencies = [
    "cat-copilot",          # Person C's simulator + intelligence (path dependency, never edited)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13.0",
    "pydantic>=2.9",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "anthropic>=0.70",
    "rank-bm25>=0.2.2",
    "fastembed>=0.8.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-socket>=0.7",
    "ruff>=0.7",
]

[tool.uv.sources]
cat-copilot = { path = "..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["copilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: hits real external services (LLM/TTS); deselected by default"]
addopts = "-m 'not live' --allow-hosts=127.0.0.1,::1 --allow-unix-socket"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.isort]
# simulator/ and intelligence/ are the repo-root package, a path dependency of this
# project - first-party, not third-party. Grouping them correctly also keeps
# `import copilot` (the sys.path bootstrap) sorted ahead of them.
known-first-party = ["copilot", "simulator", "intelligence"]
